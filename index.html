<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TeeMates - Golf Dating App</title>
    <meta name="description" content="Hitta golfpartners och träffa nya människor som delar din passion för golf" />
    <meta name="author" content="TeeMates" />

    <!-- Performance optimization: Resource hints for critical request chains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="modulepreload" href="/src/main.tsx">
    
    <!-- Critical CSS inline for above-the-fold content -->
    <style>
      /* Critical CSS for PublicLanding page - Above the fold styles only */
      *,::before,::after{box-sizing:border-box;border-width:0;border-style:solid;border-color:#e5e7eb}
      html{line-height:1.5;-webkit-text-size-adjust:100%;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;font-feature-settings:normal}
      body{margin:0;line-height:inherit}
      :root {
        --background: 0 0% 100%;
        --foreground: 140 15% 15%;
        --golf-green: 140 55% 35%;
        --golf-green-light: 140 40% 85%;
        --golf-fairway: 110 30% 45%;
        --golf-premium: 140 8% 25%;
        --gradient-golf: linear-gradient(135deg, hsl(var(--golf-green)), hsl(var(--golf-fairway)));
      }
      .min-h-screen{min-height:100vh}
      .bg-gradient-to-br{background-image:linear-gradient(to bottom right,var(--tw-gradient-stops))}
      .from-golf-green{--tw-gradient-from:hsl(var(--golf-green));--tw-gradient-to:hsl(var(--golf-green) / 0);--tw-gradient-stops:var(--tw-gradient-from),var(--tw-gradient-to)}
      .via-background{--tw-gradient-to:hsl(var(--background) / 0);--tw-gradient-stops:var(--tw-gradient-from),hsl(var(--background)),var(--tw-gradient-to)}
      .to-golf-green-light{--tw-gradient-to:hsl(var(--golf-green-light))}
      .container{width:100%;margin-left:auto;margin-right:auto;padding-left:1rem;padding-right:1rem}
      .mx-auto{margin-left:auto;margin-right:auto}.px-4{padding-left:1rem;padding-right:1rem}
      .py-16{padding-top:4rem;padding-bottom:4rem}.text-center{text-align:center}
      .mb-16{margin-bottom:4rem}.text-6xl{font-size:3.75rem;line-height:1}
      .font-bold{font-weight:700}.text-golf-premium{color:hsl(var(--golf-premium))}
      .mb-6{margin-bottom:1.5rem}.text-2xl{font-size:1.5rem;line-height:2rem}
      .max-w-3xl{max-width:48rem}.mb-8{margin-bottom:2rem}
      .text-lg{font-size:1.125rem;line-height:1.75rem}.max-w-2xl{max-width:42rem}
      @media (min-width: 640px) {.container{max-width:640px}}
      @media (min-width: 768px) {.container{max-width:768px}}
      @media (min-width: 1024px) {.container{max-width:1024px}}
      @media (min-width: 1280px) {.container{max-width:1280px}}
    </style>

    <!-- Eliminate render-blocking CSS with improved async loading -->
    <link rel="preload" href="/src/index.css" as="style" onload="this.onload=null;this.rel='stylesheet'" media="print">
    <noscript><link rel="stylesheet" href="/src/index.css"></noscript>
    
    <!-- JavaScript to ensure CSS loads without blocking -->
    <script>
      (function() {
        var link = document.querySelector('link[href="/src/index.css"]');
        if (link) {
          setTimeout(function() {
            link.media = 'all';
          }, 0);
        }
      })();
    </script>

    <meta property="og:title" content="TeeMates - Golf Dating App" />
    <meta property="og:description" content="Hitta golfpartners och träffa nya människor som delar din passion för golf" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@lovable_dev" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
